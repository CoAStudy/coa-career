<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャリア面談のお申し込み｜CoA Career</title>
<meta name="description" content="無料キャリア面談のお申し込みフォームです。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<style>
  .form-section { padding: 56px 0 96px; background: var(--color-bg-light); }
  .form-wrap { max-width: 560px; margin: 0 auto; }
  .form-intro { text-align: center; margin-bottom: 32px; }
  .form-intro .eyebrow { justify-content: center; margin-bottom: 14px; }
  .form-intro h1 { font-size: clamp(24px, 3vw, 32px); margin-bottom: 12px; }
  .form-intro p { color: var(--color-text-muted); font-size: 15px; margin: 0; }
  .form-card {
    background: #fff;
    border: 1px solid var(--color-border);
    border-top: 3px solid var(--color-primary);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    padding: 40px 36px;
  }
  .field-group { margin-bottom: 24px; }
  .field-group:last-of-type { margin-bottom: 0; }
  .field-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .field-group label .required {
    display: inline-flex;
    color: var(--color-maroon);
    background: var(--color-primary-soft);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
  }
  .field-group input,
  .field-group select {
    width: 100%;
    padding: 13px 16px;
    font-size: 15px;
    font-family: var(--font-base);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--color-text);
  }
  .field-group input:focus,
  .field-group select:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(242, 169, 59, 0.25);
  }
  .field-group.has-error input,
  .field-group.has-error select {
    border-color: #D64545;
  }
  .field-error {
    display: none;
    color: #D64545;
    font-size: 12.5px;
    margin-top: 6px;
  }
  .field-group.has-error .field-error { display: block; }
  .form-submit { margin-top: 32px; text-align: center; }
  .form-submit .btn { width: 100%; justify-content: center; }
  .form-note { text-align: center; font-size: 12.5px; color: var(--color-text-faint); margin-top: 14px; }
  .form-alert {
    display: none;
    background: #FDECEC;
    color: #B23A3A;
    border: 1px solid #F3C6C6;
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 13.5px;
    margin-bottom: 24px;
  }
  .form-alert.is-visible { display: block; }
  .btn[disabled] { opacity: .6; cursor: not-allowed; }
  @media (max-width: 640px) {
    .form-card { padding: 28px 22px; }
    .form-section { padding: 32px 0 64px; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html" aria-label="CoA Career トップへ">
      <img src="assets/images/coa-career-logo.png" alt="CoA Career" class="brand-logo-img">
      <span class="brand-tagline">メカトロニクス領域特化のキャリアエージェント</span>
    </a>
  </div>
</header>

<main id="main">
  <section class="form-section">
    <div class="container">
      <div class="form-wrap">
        <div class="form-intro">
          <p class="eyebrow eyebrow--center">FREE CONSULTATION</p>
          <h1>無料キャリア面談のお申し込み</h1>
          <p>以下のフォームにご入力ください。担当アドバイザーより折り返しご連絡いたします。</p>
        </div>

        <div class="form-card">
          <div class="form-alert" id="formAlert">送信に失敗しました。時間をおいて再度お試しください。</div>

          <form id="entryForm" novalidate>
            <div class="field-group" data-field="name">
              <label for="name">お名前<span class="required">必須</span></label>
              <input type="text" id="name" name="name" autocomplete="name">
              <p class="field-error">お名前を入力してください。</p>
            </div>

            <div class="field-group" data-field="email">
              <label for="email">メールアドレス<span class="required">必須</span></label>
              <input type="email" id="email" name="email" autocomplete="email">
              <p class="field-error">正しいメールアドレスを入力してください。</p>
            </div>

            <div class="field-group" data-field="phone">
              <label for="phone">電話番号<span class="required">必須</span></label>
              <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="例：09012345678">
              <p class="field-error">正しい電話番号を入力してください(ハイフンなしの数字のみ)。</p>
            </div>

            <div class="field-group" data-field="field">
              <label for="field">研究領域<span class="required">必須</span></label>
              <select id="field" name="field">
                <option value="">選択してください</option>
                <option value="次世代半導体デバイス開発">次世代半導体デバイス開発</option>
                <option value="電気回路設計">電気回路設計</option>
                <option value="工場自動化・ロボット制御">工場自動化・ロボット制御</option>
                <option value="組込みシステムエンジニア">組込みシステムエンジニア</option>
                <option value="宇宙産業・ハードウェア設計">宇宙産業・ハードウェア設計</option>
                <option value="先端物理シミュレーション研究">先端物理シミュレーション研究</option>
                <option value="その他">その他</option>
              </select>
              <p class="field-error">研究領域を選択してください。</p>
            </div>

            <div class="form-submit">
              <button type="submit" class="btn btn-primary btn-primary--lg" id="submitBtn">送信する</button>
              <p class="form-note">送信いただいた内容は面談のご案内のみに利用します。</p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <p>© 2026 CoA Nexus Inc. All Rights Reserved.</p>
    </div>
  </div>
</footer>

<script>
(function () {
  var form = document.getElementById('entryForm');
  var alertBox = document.getElementById('formAlert');
  var submitBtn = document.getElementById('submitBtn');

  var phonePattern = /^[0-9]{9,11}$/;
  var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setError(fieldName, hasError) {
    var group = form.querySelector('[data-field="' + fieldName + '"]');
    group.classList.toggle('has-error', hasError);
  }

  function validate() {
    var ok = true;
    var name = form.name.value.trim();
    var email = form.email.value.trim();
    var phone = form.phone.value.trim().replace(/-/g, '');
    var field = form.field.value;

    setError('name', !name); if (!name) ok = false;
    setError('email', !emailPattern.test(email)); if (!emailPattern.test(email)) ok = false;
    setError('phone', !phonePattern.test(phone)); if (!phonePattern.test(phone)) ok = false;
    setError('field', !field); if (!field) ok = false;

    return ok;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    alertBox.classList.remove('is-visible');

    if (!validate()) {
      var firstError = form.querySelector('.has-error');
      if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中…';

    fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        field: form.field.value
      })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('failed');
        window.location.href = 'thanks.html';
      })
      .catch(function () {
        alertBox.classList.add('is-visible');
        submitBtn.disabled = false;
        submitBtn.textContent = '送信する';
      });
  });
})();
</script>
</body>
</html>
