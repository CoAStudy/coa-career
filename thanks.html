<style>
  .thanks-section { padding: 96px 0; text-align: center; }
  .thanks-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--color-primary-soft);
    color: var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .thanks-icon svg { width: 30px; height: 30px; }
  .thanks-section h1 { font-size: clamp(24px, 3vw, 30px); margin-bottom: 16px; }
  .thanks-section p { color: var(--color-text-muted); font-size: 15px; max-width: 480px; margin: 0 auto 12px; }
  .thanks-back { margin-top: 32px; }

<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html" aria-label="CoA Career トップへ">

<main>
  <section class="thanks-section">

      <span class="thanks-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>

      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
